<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur QR de Paiement</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <h3>Créer mon QR de Paiement</h3>
    <input type="text" id="name" placeholder="Nom du bénéficiaire" oninput="generateQR()">
    <input type="text" id="iban" placeholder="IBAN (ex: BE...)" oninput="generateQR()">
    <input type="number" id="amount" placeholder="Montant (ex: 12.50)" oninput="generateQR()">
    <input type="text" id="comm" placeholder="Communication" oninput="generateQR()">
    
    <div id="qrcode"></div>
    <p style="font-size: 0.8rem; color: #666;">Scannez ce code avec votre app bancaire ou Payconiq</p>
</div>

<script>
    function generateQR() {
        const name = document.getElementById('name').value;
        const iban = document.getElementById('iban').value.replace(/\s/g, '');
        const amount = parseFloat(document.getElementById('amount').value).toFixed(2);
        const comm = document.getElementById('comm').value;

        // Format Standard EPC pour les virements SEPA
        // BCD = Binary Coded Data (Standard européen)
        const epcData = `BCD\n002\n1\nSCT\n\n${name}\n${iban}\nEUR${amount}\n\n\n${comm}`;

        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: epcData,
            width: 200,
            height: 200
        });
    }
</script>

</body>
</html>
